<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Clean | Agile E-Portfolio</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
{
box-sizing: border-box;
}
body {
margin: 0;
padding: 30px 16px;
background: #F7F4EC;
color: #304F59;
font-family: Arial, sans-serif;
line-height: 1.7;
}
main {
max-width: 950px;
margin: auto;
padding: 40px;
background: #FFFFFF;
border-radius: 14px;
box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}
h1, h2, h3, h4 {
color: #3F5F43;
}
h1 {
border-bottom: 2px solid #E2E6E0;
padding-bottom: 15px;
}
h2 {
margin-top: 35px;
border-bottom: 1px solid #E2E6E0;
padding-bottom: 8px;
}
a {
color: #4F6F52;
font-weight: 600;
}
img {
display: block;
max-width: 100%;
height: auto;
margin: 18px auto;
border-radius: 10px;
}
blockquote {
border-left: 4px solid #4F6F52;
margin-left: 0;
padding: 10px 20px;
background: #EAF0E8;
}
pre {
overflow-x: auto;
padding: 15px;
background: #F7F4EC;
border-radius: 8px;
}
table {
width: 100%;
border-collapse: collapse;
margin: 20px 0;
}
th, td {
border: 1px solid #E2E6E0;
padding: 10px;
text-align: left;
}
th {
background: #EAF0E8;
}
li {
margin-bottom: 8px;
}
footer {
margin-top: 40px;
padding-top: 20px;
border-top: 1px solid #E2E6E0;
text-align: center;
color: #667A78;
font-size: 14px;
}
#portfolio {
min-height: 150px;
}
@media (max-width: 600px) {
main {
padding: 22px 16px;
}
body {
padding: 15px 10px;
}
}
</style>
</head>
<body>
<main>
<div id="portfolio">
<p>Loading Go Clean portfolio...</p>
</div>
<footer>
Go Clean Laundry Service | Agile Project E-Portfolio
</footer>
</main>
<script>
async function loadPortfolio() {
const portfolio = document.getElementById("portfolio");
try {
if (typeof marked === "undefined") {
throw new Error("The Markdown library could not load. Please refresh the page.");
}
const filenames = [
"WIL-Project.md",
"WIL-Project.md"
];
let response = null;
for (const filename of filenames) {
const result = await fetch('WIL-Project.md');
if (result.ok) {
response = result;
break;
}
}
if (!response) {
throw new Error(
"Could not find your WIL Markdown file. Please check its exact filename in GitHub."
);
}
const markdown = await response.text();
portfolio.innerHTML = marked.parse(markdown);
} catch (error) {
portfolio.innerHTML = `
<h2>Unable to load portfolio</h2>
<p>${error.message}</p>
<p>Please check your GitHub Pages deployment and try again.</p>
`;
}
}
loadPortfolio();
</script>
</body>
</html>
